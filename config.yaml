# ============================================================
#  YouTube Video Botu - Ayarlar
#  Bu dosyayı Not Defteri ile açıp değiştirebilirsin.
# ============================================================

channel:
  niche: "Genel bilgi ve ilginç gerçekler"
  audience: "Meraklı, 18-45 yaş arası Türk izleyici"
  tone: "Merak uyandıran, samimi, akıcı ama ciddi; abartısız ve doğru bilgi veren"
  # Kanalın odaklanacağı alt konular (bot bunlardan seçer, boş bırakırsan serbest seçer)
  topic_pool:
    - insan vücudunun şaşırtıcı gerçekleri
    - izleyicinin kendi vücudu/beyni hakkında sezgiye ters gerçekler ("vücudun sana bunu söylemiyor" tarzı; kanalda en çok izlenenlerden)
    - beyninin seni her gün kandırdığı şeyler (algı, hafıza, zaman)
    - uzayın korkutucu gerçekleri
    - tarihin karanlık sırları ve az bilinen olayları
    - çözülememiş gizemler
    - doğal afetler ve felaketler
    - olağanüstü hayatta kalma hikâyeleri
    - olağanüstü hayatta kalma hikâyeleri (kanalda en çok izlenen tür)
    - gerçek kaza, mahsur kalma ve kurtarma hikâyeleri
    - doğa karşısında insan: mahsur kalma ve hayatta kalma mücadeleleri
    - dünya rekorları ve uç noktalar
    - ya olsaydı türünden bilimsel senaryolar
    - tehlikeli ve tuhaf hayvanlar
    - Osmanlı ve Anadolu'nun ilginç gerçekleri
    - mühendislik harikaları ve büyük başarısızlıklar
    - beynin ve psikolojinin tuhaflıkları

video:
  target_minutes: 7.8        # anlatım süresi; soğuk açılış + giriş + bitiş ekranıyla toplam ~8,5 dk (8 dk üstü = ara reklam açılır)
  width: 1920
  height: 1080
  fps: 30
  ai_image_ratio: 0.35       # Sahnelerin yaklaşık ne kadarı yapay zeka görseli olsun (0-1)
  cold_open: true            # Video, hikâyenin en çarpıcı anıyla (20-25 sn) başlar, sonra jenerik girer
  branding: true             # Kanal jeneriği ve sonda 12 sn'lik bitiş ekranı
  intro_animation: true      # true = 8 sn'lik kravatlı adam animasyonu, false = 3 sn'lik kısa logo
  scene_padding: 0.2         # Sahneler arasında bırakılan sessizlik (saniye)
  music_volume: 0.4          # 0 = müzik yok; 0.4 = normal (daha yüksek değer müziği yükseltir)
  music_below_voice_db: 12   # konuşma aralarında müzik, anlatıcı sesinin bu kadar dB altında (konuşurken ayrıca kısılır)
  subtitle_font: "Arial"     # Windows'ta Arial vardır
  subtitle_size: 62

voice:
  # "gemini" = Gemini TTS doğal Türkçe ses (ÜCRETSİZ katman, mevcut GEMINI_API_KEY ile; çalışmazsa otomatik piper)
  # "google" = Google Cloud doğal Türkçe ses (GOOGLE_TTS_KEY secret'ı gerekir; yoksa/çalışmazsa otomatik piper)
  # "piper"  = çevrimdışı Türkçe ses (her zaman çalışır, yedek)
  # "edge"   = Microsoft Edge sesi (GitHub sunucularında şu an engelli)
  engine: "klon"            # "klon" = kullanıcının klon sesi (Kaggle ekran kartı, Whisper kontrollü); olmazsa otomatik gemini → piper
  klon_yer: "kaggle"         # Klon ses nerede okunsun: "kaggle" = ücretsiz ekran kartı (KAGGLE_API_TOKEN); olmazsa işlemci
  klon_wpm: 112              # klon sesin okuma hızı (kelime/dk) — senaryo uzunluğu buna göre hesaplanır
  klon_min_benzerlik: 0.6    # Klon ses Whisper ile kontrol edilir; metne bu orandan az benzeyen parça yeniden okunur
  gemini_voice: "Sadaltager" # Diğer erkek sesler: Charon, Orus, Algenib, Iapetus, Rasalgethi, Alnilam
  gemini_model: "gemini-3.8-flash-tts"
  gemini_fallbacks: ["gemini-3.8-flash-lite-tts"]
  gemini_style: "Türkçe belgesel anlatıcısı: sıcak, güven veren, merak uyandıran; doğal vurgular, canlı ve akıcı tempo, cümle sonlarında doğal duraklar. Abartılı oyunculuk yok."
  gemini_wpm: 145            # hedef okuma hızı (kelime/dk); daha yavaş okursa hafifçe hızlandırılır
  gemini_group_words: 500    # tek istekte okunacak en fazla kelime (ücretsiz ses kotası günde ~10 istek: video 2 eşit parçada okunur)
  whisper_model: "base"      # bölüm sesini sahnelere bölmek için hizalama modeli (base = hızlı, small = daha isabetli)
  google_voice: "tr-TR-Chirp3-HD-Charon"   # Erkek ses. Diğerleri: tr-TR-Chirp3-HD-Fenrir, -Orus, kadın: -Aoede, -Kore
  name: "tr-TR-AhmetNeural"  # Sadece edge için. Kadın ses: tr-TR-EmelNeural
  rate: "+15%"               # Konuşma hızı (-20% yavaş, +20% hızlı)

llm:
  # "gemini" = ÜCRETSİZ (Google AI Studio ücretsiz katmanı)
  # "claude" = ücretli, daha kaliteli Türkçe (ileride para harcamak istersen)
  provider: "gemini"
  gemini_model: "gemini-3.8-flash"   # Ücretsiz katmanda çalışan model (kapanırsa bot otomatik yenisine geçer)
  claude_model: "claude-sonnet-5-5"
  # Model kapanırsa ya da günlük ücretsiz kotası dolarsa sırayla bunlara geçilir
  gemini_fallbacks: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
  # Ayrı doğruluk kontrolü (video başına +6 istek). Ücretsiz katmanda kapalı tutun;
  # doğruluk kuralları zaten bölüm yazımının içinde uygulanıyor.
  fact_check: false

images:
  # "cloudflare" = her sahne sabit kâğıt kesme tarzında yapay zekâyla çizilir (Cloudflare Workers AI,
  #                ücretsiz günlük kota; CF_ACCOUNT_ID ve CF_API_TOKEN secret'ları gerekir)
  #                Kota biterse/çalışmazsa: Wikimedia Commons / Openverse fotoğrafı + kâğıt kesme efekti
  # "none"       = sadece fotoğraf + kâğıt kesme efekti
  provider: "cloudflare"
  cf_model: "@cf/black-forest-labs/flux-1-schnell"
  cf_steps: 4                # 4 adım = modelin önerdiği değer; ücretsiz günlük kotayı yarı yarıya korur
  # Kanalın sabit çizim tarzı (her sahnenin tarifine eklenir)
  style_prompt: >-
    Handmade layered paper-cut craft diorama illustration, made entirely of cut and folded colored paper,
    visible paper fibers and texture, soft drop shadows between paper layers, depth like a shadow box,
    muted palette of cream, beige, warm brown and charcoal with a single crimson red accent,
    documentary explainer style, ONE large clearly recognizable main subject in the foreground with a bold
    readable silhouette, few large paper layers, plain uncluttered light background, bright even lighting,
    strong contrast between subject and background, instantly understandable even at small size,
    wide 16:9 framing with the subject centered,
    no text, no letters, no numbers, no words, no watermark, no logo
  # Fotoğraflara uygulanan stil: "kagit" = kâğıt kesme efekti, "sinema" = sinematik ton
  photo_style: "baski"      # "baski" = okunaklı kâğıt baskı (önerilen), "kagit" = yoğun kâğıt kesme (eski, bazen anlaşılmıyordu)
  # Kanal kimliği çerçevesi: "kolaj" = kâğıt zemin + yırtık kenarlı görsel + kırmızı bant, "yok" = tam ekran
  frame: "kolaj"
  free_model: "flux"
  model: "gemini-2.5-flash-image"

scout:
  enabled: true              # Konu avcısı: İngilizce'de patlamış videoların KONULARINI önerir (kopyalamaz)
  every_n_days: 2            # Takvimde konu olmayan günlerin kaçta birinde bu listeden seçilsin

shorts:
  enabled: true
  per_video: 3               # Her uzun videodan kaç Short (Short'lar izlenmenin %74'ünü getirdi; 23 Eki'de 3'e çıktı)
  day_offset: 1              # Uzun video yayına girdikten kaç gün sonra
  publish_times: ["12:00", "15:00", "21:00"]
  voice_engine: "klon"       # Short'lar kullanıcının klon sesiyle (Chatterbox, CPU). Kurulu değilse Gemini sesi

upload:
  enabled: true
  category_id: "27"          # 27 = Eğitim, 28 = Bilim ve Teknoloji
  made_for_kids: false
  synthetic_media: true      # YouTube'a "yapay zeka ile üretildi" bilgisi verilir (önerilir)
  # Planlama: videolar bu saatlerde yayına girer (Türkiye saati)
  timezone: "Europe/Istanbul"
  publish_times: ["19:00"]   # Örn: ["12:00", "19:00"] günde iki video
  # true: videolar "özel" yüklenir, belirlenen saatte otomatik herkese açılır
  schedule: true
  # Oynatma listeleri: bot her videoyu konusuna göre bunlardan birine ekler (liste yoksa kendisi oluşturur)
  playlists:
    - "Hayatta Kalma Hikâyeleri"
    - "Tarihin Karanlık Sırları"
    - "Uzayın ve Bilimin Gizemleri"
    - "İnsan Vücudu ve Beynin Tuhaflıkları"
    - "Doğanın Gücü: Afetler ve Canlılar"
    - "Çözülemeyen Gizemler"
    - "Anadolu ve Osmanlı'nın Bilinmeyenleri"
    - "Vurgun Dosyaları"
  first_comment: true        # Video yayına girince kanal, izleyiciye soru soran ilk yorumu yazar
  watermark: true            # Videolarda köşede "abone ol" filigranı (kravat logosu), bir kez ayarlanır
  thumbnail_variants: true   # Her video için 3 kapak üretilir (kapaklar/ klasörü): Studio'da "Test ve karşılaştır" için
