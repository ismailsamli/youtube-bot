name: Kaggle klon ses testi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketler
        run: |
          bash tools/ffmpeg_kur.sh
          pip install -q -r requirements.txt
          pip install -q -U kaggle
      - name: Test
        run: |
          set -o pipefail
          python tools/kaggle_test.py 2>&1 | tee log.txt
      - name: Kayıt
        if: always()
        run: |
          msg=$(tail -20 log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Kaggle testi::${msg}"
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          [ -e ses_ornekleri/kaggle_klon_deneme.mp3 ] && git add ses_ornekleri/kaggle_klon_deneme.mp3
          if ! git diff --cached --quiet; then
            git commit -qm "Kaggle klon ses örneği"
            git pull --rebase -q && git push -q
          fi
