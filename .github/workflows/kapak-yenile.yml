name: Kapakları Yenile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kapak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketler
        run: pip install -q -r requirements.txt
      - name: Kapakları yenile
        run: |
          python tools/kapak_yenile.py 2>&1 | tee log.txt
          msg=$(grep -v "hesap listesi" log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Kapaklar::${msg}"
      - name: Kapakları kaydet
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add kapaklar 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Yenilenen kapaklar"
            git pull --rebase -q && git push -q
          fi
