name: Müzik İndir

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç parça olsun"
        default: "8"
        required: true

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q requests PyYAML python-dotenv
      - name: Müzikleri indir
        run: |
          python tools/muzik_indir.py "${{ inputs.adet }}" 2>&1 | tee muzik_log.txt
          msg=$(cut -c1-250 muzik_log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Müzik::${msg}"
      - name: Kaydet
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add assets/music
          if ! git diff --cached --quiet; then
            git commit -m "Arka plan müzikleri eklendi"
            git pull --rebase -q && git push -q
          fi
