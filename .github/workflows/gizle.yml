name: Videoyu gizle (özel yap, silmez)

on:
  workflow_dispatch:
    inputs:
      videolar:
        description: "Boşlukla ayrılmış video ID'leri"
        required: true

jobs:
  gizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      PYTHONIOENCODING: "utf-8"
      VIDEOLAR: ${{ inputs.videolar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Gizle
        run: |
          python tools/gizle.py $VIDEOLAR 2>&1 | tee log.txt
          msg=$(tail -12 log.txt | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Gizle::${msg}"
