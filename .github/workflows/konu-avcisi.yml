name: Konu Avcısı

on:
  schedule:
    - cron: "17 5 * * 1"      # her pazartesi ~08:17 TR
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  avci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Konuları bul
        run: |
          set -o pipefail
          python tools/konu_avcisi.py 2>&1 | tee log.txt
          msg=$(tail -40 log.txt | cut -c1-260 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Konu avcısı::${msg}"
      - name: Kaydet
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          [ -e data/konu_onerileri.json ] && git add data/konu_onerileri.json
          if ! git diff --cached --quiet; then git commit -m "Konu önerileri" && git pull --rebase -q && git push -q; fi
