name: İstatistik

on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük"
        default: "14"

permissions:
  contents: write

jobs:
  stat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: İstatistikleri al
        run: |
          python tools/istatistik.py "${{ inputs.gun }}" 2>&1 | tee log.txt
          msg=$(head -60 log.txt | cut -c1-220 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=İstatistik::${msg}"
      - name: Kaydet
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          [ -e data/istatistik.json ] && git add data/istatistik.json
          if ! git diff --cached --quiet; then
            git commit -m "İstatistik"
            git pull --rebase -q && git push -q
          fi
