name: Görsel Örnekleri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketler
        run: pip install -q -r requirements.txt
      - name: Örnekleri üret
        run: |
          python tools/gorsel_ornekleri.py 2>&1 | tee log.txt
          msg=$(cut -c1-300 log.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Görsel örnekleri::${msg}"
      - name: Örnekleri kaydet
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add gorsel_ornekleri/*.jpg 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Görsel örnekleri"
            git pull --rebase -q && git push -q
          fi
