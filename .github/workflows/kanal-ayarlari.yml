name: Kanal Ayarları

on:
  workflow_dispatch:

jobs:
  ayar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Güncelle
        run: |
          python tools/kanal_ayarlari.py 2>&1 | tee log.txt
          msg=$(tail -12 log.txt | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Kanal ayarları::${msg}"
