name: Video Üret

on:
  schedule:
    # Her gün Türkiye saatiyle 11:13'te çalışır (GitHub saati UTC: 08:13).
    # Gemini ücretsiz kotası ABD Pasifik gece yarısı (TR 10:00-11:00) yenilendiği için bundan sonra çalışır.
    # Video, config.yaml'daki yayın saatine (varsayılan 19:00) planlanır.
    - cron: "13 8 * * *"
  workflow_dispatch:
    inputs:
      adet:
        description: "Kaç video üretilsin"
        default: "1"
        required: true
      konu:
        description: "Belirli bir konu (boş bırakırsan bot seçer)"
        default: ""
        required: false
      yukle:
        description: "YouTube'a yüklensin mi?"
        type: boolean
        default: true
      devam_run:
        description: "Yarıda kalan bir işlemin numarası (senaryosu hazırsa oradan devam eder; boş bırak)"
        default: ""
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Klon ses için Python 3.11
        id: klonpy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg ve fontları kur
        run: |
          bash tools/ffmpeg_kur.sh

      - name: Python paketlerini kur
        run: |
          pip install -q -r requirements.txt
          pip install -q "kaggle==2.2.5" six || true

      - name: Klon ses ortamını kur (Short'lar için; olmazsa Gemini sesi kullanılır)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          "${{ steps.klonpy.outputs.python-path }}" -m venv /opt/klon
          /opt/klon/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /opt/klon/bin/pip install -q chatterbox-tts > klon_pip.txt 2>&1 || { tail -5 klon_pip.txt; exit 1; }
          echo "KLON_PY=/opt/klon/bin/python" >> "$GITHUB_ENV"

      - name: Hizalama modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-modelleri-v1

      - name: Yarıda kalan senaryoyu indir
        if: ${{ inputs.devam_run != '' && inputs.devam_run != null }}
        uses: actions/download-artifact@v4
        with:
          name: videolar
          run-id: ${{ inputs.devam_run }}
          github-token: ${{ github.token }}
          path: devam

      - name: Video üret
        env:
          ADET: ${{ inputs.adet || '1' }}
          KONU: ${{ inputs.konu }}
          YUKLE: ${{ inputs.yukle }}
        run: |
          ARGS=(--count "$ADET")
          if [ -n "$KONU" ]; then ARGS+=(--topic "$KONU"); fi
          if [ -d devam/output ]; then
            D=$(ls -d devam/output/*/ | head -1)
            mkdir -p output && cp -r "$D" output/
            ARGS+=(--resume "output/$(basename "$D")")
            echo "Kaldığı yerden devam: $D"
          fi
          if [ "$YUKLE" = "false" ]; then ARGS+=(--no-upload); fi
          # Zamanlanmış (otomatik) çalışmada: sırada 2 video varsa yenisini üretme (GitHub geç tetiklerse birikmesin)
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS+=(--max-queue 2); fi
          echo "Komut: python run.py ${ARGS[*]}"
          set -o pipefail
          python run.py "${ARGS[@]}" --keep-files 2>&1 | tee bot_log.txt

      - name: Video geçmişini kaydet
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          for f in data/history.json data/kanal_durumu.json data/konu_onerileri.json kapaklar; do [ -e "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "Video geçmişi güncellendi"
            git pull --rebase -q && git push -q
          fi

      - name: Özet
        if: always()
        run: |
          echo "## Üretilen videolar" >> $GITHUB_STEP_SUMMARY
          for d in output/*/; do
            [ -f "$d/youtube_bilgileri.txt" ] || continue
            echo "### $(head -2 "$d/youtube_bilgileri.txt" | tail -1)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Video, kapak ve senaryo aşağıdaki **Artifacts** bölümünden 3 gün boyunca indirilebilir." >> $GITHUB_STEP_SUMMARY
          if [ -f bot_log.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Bot kaydı (son 60 satır)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 bot_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Son satırlar uyarı olarak da yazılır (API ile okunabilsin diye)
            msg=$(tail -n 25 bot_log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::notice title=Bot kaydı::${msg}"
            imp=$(grep -E "Gemini|Piper|seslendirme|Müzik|müzik|hizalama|Cloudflare|HATA|kullanılamıyor|atlandı|seçilmiş konu|Senaryo hazır|Video hazır|Short . hazır|liste|yorum|Yorum|filigran|Kapak testi|çizim|klon ses|Klon ses|UYARI|Önizleme|Jenerik|Soğuk açılış" bot_log.txt | head -40 | cut -c1-250 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::notice title=Önemli satırlar::${imp}"
          fi

      - name: Videoları indirilebilir yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videolar
          path: |
            output/*/video.mp4
            output/*/thumbnail.jpg
            output/*/senaryo.txt
            output/*/youtube_bilgileri.txt
            output/*/script.json
            bot_log.txt
          retention-days: 3
          if-no-files-found: ignore
