name: Kanal fragmanı

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "deneme (üret, yükleme) ya da yukle (denemedeki videoyu yükle ve fragman yap)"
        required: true
        default: "deneme"

permissions:
  contents: write

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  fragman:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - name: Klon ses için Python 3.11
        id: klonpy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg ve fontları kur
        run: |
          bash tools/ffmpeg_kur.sh

      - name: Python paketlerini kur
        run: |
          pip install -q -r requirements.txt
          pip install -q "kaggle==2.2.5" six || true

      - name: Klon ses ortamını kur (olmazsa Gemini sesi kullanılır)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          "${{ steps.klonpy.outputs.python-path }}" -m venv /opt/klon
          /opt/klon/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /opt/klon/bin/pip install -q chatterbox-tts > klon_pip.txt 2>&1 || { tail -5 klon_pip.txt; exit 1; }
          echo "KLON_PY=/opt/klon/bin/python" >> "$GITHUB_ENV"

      - name: Hizalama modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-modelleri-v1

      - name: Fragman
        run: |
          set -o pipefail
          python tools/fragman.py "${{ inputs.mod }}" 2>&1 | tee log.txt
          msg=$(tail -15 log.txt | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Fragman::${msg}"

      - name: Kaydet
        if: ${{ inputs.mod == 'deneme' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add onizleme_kesit/fragman
          git commit -m "Deneme fragmanı" || exit 0
          git pull --rebase -q && git push -q
