name: Tek Short

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Short konusu"
        required: true
      yayin:
        description: "Yayın zamanı (Türkiye saati) ör. 2026-10-22 21:00"
        required: true
      ek:
        description: "Ek talimat (isteğe bağlı)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PYTHONIOENCODING: "utf-8"
      KONU: ${{ inputs.konu }}
      YAYIN: ${{ inputs.yayin }}
      EK: ${{ inputs.ek }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core > /dev/null
          pip install -q -r requirements.txt
      - name: Short üret ve yükle
        run: |
          set -o pipefail
          python tools/tek_short.py "$KONU" "$YAYIN" "$EK" 2>&1 | tee log.txt
      - name: Kayıt
        if: always()
        run: |
          msg=$(tail -25 log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Bot kaydı::${msg}"
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Tek Short kaydı"
            git pull --rebase -q && git push -q
          fi
