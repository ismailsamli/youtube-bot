name: Tek Short

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "Short konusu"
        required: true
      yayin:
        description: "Yayın zamanı (Türkiye saati) ör. 2026-10-22 21:00 — ya da 'deneme' (yüklemez)"
        required: true
      ek:
        description: "Ek talimat (isteğe bağlı)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PYTHONIOENCODING: "utf-8"
      KONU: ${{ inputs.konu }}
      YAYIN: ${{ inputs.yayin }}
      EK: ${{ inputs.ek }}
    steps:
      - uses: actions/checkout@v4
      - name: Klon ses için Python 3.11
        id: klonpy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Paketler
        run: |
          bash tools/ffmpeg_kur.sh
          pip install -q -r requirements.txt
          pip install -q "kaggle==2.2.5" six || true
      - name: Klon ses ortamını kur (Short'lar için; olmazsa Gemini sesi kullanılır)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          "${{ steps.klonpy.outputs.python-path }}" -m venv /opt/klon
          /opt/klon/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /opt/klon/bin/pip install -q chatterbox-tts > klon_pip.txt 2>&1 || { tail -5 klon_pip.txt; exit 1; }
          echo "KLON_PY=/opt/klon/bin/python" >> "$GITHUB_ENV"
      - name: Short üret ve yükle
        run: |
          set -o pipefail
          python tools/tek_short.py "$KONU" "$YAYIN" "$EK" 2>&1 | tee log.txt
      - name: Kayıt
        if: always()
        run: |
          msg=$(tail -25 log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Bot kaydı::${msg}"
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json 2>/dev/null || true
          [ -e onizleme_kesit/short_deneme.mp4 ] && git add onizleme_kesit/short_deneme.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Tek Short kaydı" -q
            git pull --rebase -q && git push -q
          fi
