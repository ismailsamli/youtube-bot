name: Başlık Değiştir

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Video ID"
        required: true
      baslik:
        description: "Yeni başlık"
        required: true

permissions:
  contents: write

concurrency:
  group: video-uret
  cancel-in-progress: false

jobs:
  baslik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      PYTHONIOENCODING: "utf-8"
      VID: ${{ inputs.video }}
      BASLIK: ${{ inputs.baslik }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Değiştir
        run: |
          python tools/baslik_degistir.py "$VID" "$BASLIK" 2>&1 | tee log.txt
          msg=$(tail -5 log.txt | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Başlık::${msg}"
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then git commit -m "Başlık değişti" && git pull --rebase -q && git push -q; fi
